kind = "mobile"
previewPath = "/mobile/"
title = "LockBox Mobile"
version = "1.0.0"
id = "artifacts/lockbox-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18443

[services.development]
run = "pnpm --filter @workspace/lockbox-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lockbox-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lockbox-mobile", "run", "serve" ]

[services.env]
PORT = "18443"
BASE_PATH = "/mobile/"
